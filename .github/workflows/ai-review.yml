name: AI Review (Gemini)

# Free AI reviewer for pull requests in this fork: the same code that will run
# upstream, so a change is checked before it is proposed there.
#
# Security:
# - the GEMINI_API_KEY secret is only available to pull requests from branches
#   of this same repository (branches of other forks are rejected by the
#   head.repo.full_name check);
# - pull_request_target is not used, so the pull request code never runs with the
#   workflow's permissions;
# - third-party actions are pinned to a specific commit;
# - the code-review extension is installed from a pinned commit instead of its
#   default branch (see the install step), and the Gemini CLI version is pinned as
#   well;
# - the github-mcp-server container runs by digest instead of by tag;
# - the workflow cannot create releases or deploy anything.

on:
  pull_request:
    # ready_for_review: a draft is not reviewed when it is opened, but it is
    # reviewed as soon as the author marks it ready.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # The reviewer only reads the pull request and leaves comments on it. The
  # issues: write permission is not needed: comments go through the Review API and
  # the MCP tools are restricted to the includeTools list below. The access is
  # therefore kept at the minimum.
  pull-requests: write

jobs:
  review:
    # Only this repository's own branches: the secret must not reach code from
    # another fork.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # ratchet:actions/checkout@v6
        with:
          persist-credentials: 'false'

      # The code-review extension used to be pulled in through with.extensions as
      # https://github.com/gemini-cli-extensions/code-review, that is from its
      # default branch. run-gemini-cli has no way to pass --ref, so a change to that
      # branch would run foreign code in this job with the GITHUB_TOKEN
      # (pull-requests: write) and the GEMINI_API_KEY, bypassing the review.
      # The extension is therefore installed from a pinned commit (the repository
      # has no tags), and the Gemini CLI is the same version as the action below,
      # so the steps cannot drift apart.
      - name: Install the pinned code-review extension
        env:
          GEMINI_CLI_VERSION: '0.67.0'
          CODE_REVIEW_EXTENSION_REF: 'dd1a10d2c9d07b2ebade866590fdfa59cd8f9d04'
        run: |
          set -euo pipefail
          npm install --silent --no-audit --prefer-offline --global "@google/gemini-cli@${GEMINI_CLI_VERSION}"
          gemini extensions install \
            https://github.com/gemini-cli-extensions/code-review \
            --ref "${CODE_REVIEW_EXTENSION_REF}" \
            --consent
          gemini extensions list

      - name: Run Gemini pull request review
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # ratchet:google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          ADDITIONAL_CONTEXT: 'Focus on correctness, races and resource leaks in the ACP provider code.'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          # The version is pinned: 'latest' is a mutable dependency too, and the
          # extension above is installed with exactly this CLI version.
          gemini_cli_version: '0.67.0'
          gemini_model: '${{ vars.GEMINI_MODEL }}'
          github_pr_number: ${{ github.event.pull_request.number }}
          workflow_name: 'ai-review'
          # No extension here on purpose: the extension is installed by the step
          # above from a pinned commit.
          settings: |-
            {
              "model": {
                "maxSessionTurns": 8
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server@sha256:a1d43076a36638ee24520fd6e83c3905ae41bc9850179081df1de2ba3a7afae0"
                  ],
                  "includeTools": [
                    "add_comment_to_pending_review",
                    "pull_request_read",
                    "pull_request_review_write"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": []
              }
            }
          prompt: '/pr-code-review'
