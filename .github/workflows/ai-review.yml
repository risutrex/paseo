name: AI Review (Gemini)

# Бесплатный AI-ревьюер для PR в этом форке: тот же код, что будет работать в
# upstream, чтобы проверять изменения до отправки PR туда.
#
# Безопасность:
# - ключ GEMINI_API_KEY доступен только PR из веток этого же репозитория
#   (ветки чужих форков отсекаются проверкой head.repo.full_name);
# - pull_request_target не используется, код PR не исполняется с правами workflow;
# - сторонние action'ы запинены на конкретный коммит;
# - у workflow нет права создавать релизы и деплоить.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  review:
    # Только свои ветки: секрет не должен попасть к коду из чужого форка.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # ratchet:actions/checkout@v6
        with:
          persist-credentials: 'false'

      - name: Run Gemini pull request review
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # ratchet:google-github-actions/run-gemini-cli@v0.1.22
        env:
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          ADDITIONAL_CONTEXT: 'Focus on correctness, races and resource leaks in the ACP provider code.'
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: '${{ vars.GEMINI_MODEL }}'
          github_pr_number: ${{ github.event.pull_request.number }}
          workflow_name: 'ai-review'
          settings: |-
            {
              "model": {
                "maxSessionTurns": 10
              },
              "telemetry": {
                "enabled": true,
                "target": "local",
                "outfile": ".gemini/telemetry.log"
              },
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v0.27.0"
                  ],
                  "includeTools": [
                    "add_comment_to_pending_review",
                    "pull_request_read",
                    "pull_request_review_write"
                  ],
                  "env": {
                    "GITHUB_PERSONAL_ACCESS_TOKEN": "${GITHUB_TOKEN}"
                  }
                }
              },
              "tools": {
                "core": []
              }
            }
          extensions: |-
            [
              "https://github.com/gemini-cli-extensions/code-review"
            ]
          prompt: '/pr-code-review'
