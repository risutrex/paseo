name: Diagnostics (gateway reachability)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Host network
        run: |
          set -u
          host="gate.trinity.guru"
          echo "== host DNS =="
          getent ahosts "$host" | head -4
          echo "== host POST =="
          curl -sS -o /dev/null -m 20 -w 'host POST -> %{http_code} in %{time_total}s\n' \
            -X POST "https://$host/omni/v1/messages" -H 'content-type: application/json' \
            -d '{"model":"x","max_tokens":1,"messages":[{"role":"user","content":"hi"}]}' || echo "host POST failed"

      - name: Inside the PR-Agent image
        run: |
          docker run --rm --entrypoint python3 pragent/pr-agent@sha256:b1ed6e8de56eb4d6e4169ee0d5c209bb5ed1ef071a01c0c042c64b80192a785c -c "
import socket, ssl, urllib.request, json, time
host='gate.trinity.guru'
try:
    infos=socket.getaddrinfo(host, 443, proto=socket.IPPROTO_TCP)
    print('getaddrinfo:', [(i[0].name, i[4][0]) for i in infos])
except Exception as e:
    print('getaddrinfo failed:', e)
for fam,addr in [(i[0], i[4]) for i in infos][:4]:
    t0=time.time()
    try:
        s=socket.socket(fam, socket.SOCK_STREAM); s.settimeout(8); s.connect(addr)
        print('connect', addr, 'ok in %.2fs' % (time.time()-t0)); s.close()
    except Exception as e:
        print('connect', addr, 'failed:', type(e).__name__, e, 'after %.2fs' % (time.time()-t0))
try:
    req=urllib.request.Request('https://'+host+'/omni/v1/messages', data=json.dumps({'model':'x','max_tokens':1,'messages':[{'role':'user','content':'hi'}]}).encode(), headers={'content-type':'application/json'})
    t0=time.time()
    with urllib.request.urlopen(req, timeout=12) as r:
        print('urllib POST ->', r.status, '%.2fs' % (time.time()-t0))
except Exception as e:
    print('urllib POST failed:', type(e).__name__, str(e)[:200], '%.2fs' % (time.time()-t0))
"
