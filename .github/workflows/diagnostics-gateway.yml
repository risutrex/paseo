name: Diagnostics (gateway reachability)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find the 120 second default
        run: |
          cat > /tmp/probe.py <<'PY'
          import pathlib
          import pr_agent

          root = pathlib.Path(pr_agent.__file__).parent
          hits = [(str(p.relative_to(root)), n, l.strip()[:150]) for p in root.rglob("*.py") for n, l in enumerate(p.read_text(errors="ignore").splitlines(), 1) if "= 120" in l or "120)" in l and "timeout" in l.lower() or "CONFIG__" in l or "class Settings" in l]
          print(chr(10).join(" | ".join(map(str, h)) for h in hits[:35]) or "no hits")
          PY
          docker run --rm -v /tmp/probe.py:/probe.py:ro --entrypoint python3 \
            pragent/pr-agent@sha256:b1ed6e8de56eb4d6e4169ee0d5c209bb5ed1ef071a01c0c042c64b80192a785c /probe.py
