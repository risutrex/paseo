name: Diagnostics (gateway reachability)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Where does LiteLLM connect
        run: |
          cat > /tmp/probe.py <<'PY'
          import os
          import socket
          import time
          import urllib.request

          print("--- plain https to api.anthropic.com ---")
          started = time.time()
          try:
              request = urllib.request.Request("https://api.anthropic.com/v1/messages", data=b"{}", headers={"content-type": "application/json"})
              with urllib.request.urlopen(request, timeout=15) as response:
                  print("anthropic.com ->", response.status, "%.2fs" % (time.time() - started))
          except Exception as error:
              print("anthropic.com failed:", type(error).__name__, str(error)[:120], "%.2fs" % (time.time() - started))

          print("--- litellm with ANTHROPIC_API_BASE set ---")
          os.environ["ANTHROPIC_API_BASE"] = "https://gate.trinity.guru/omni"
          os.environ["ANTHROPIC_API_KEY"] = "dummy-key"
          import litellm

          print("litellm version:", getattr(litellm, "__version__", "?"))
          print("litellm.api_base:", litellm.api_base)
          started = time.time()
          try:
              litellm.completion(
                  model="anthropic/deepseek-v4.1-flash",
                  messages=[{"role": "user", "content": "hi"}],
                  timeout=25,
              )
              print("completion OK %.2fs" % (time.time() - started))
          except Exception as error:
              print("completion failed:", type(error).__name__, str(error)[:300], "%.2fs" % (time.time() - started))
              print("  api_base:", getattr(error, "api_base", None))
              print("  model:", getattr(error, "model", None))
          PY
          docker run --rm -v /tmp/probe.py:/probe.py:ro --entrypoint python3 \
            pragent/pr-agent@sha256:b1ed6e8de56eb4d6e4169ee0d5c209bb5ed1ef071a01c0c042c64b80192a785c /probe.py
