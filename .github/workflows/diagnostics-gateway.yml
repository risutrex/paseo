name: Diagnostics (gateway reachability)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find the timeout setting
        run: |
          docker run --rm --entrypoint sh pragent/pr-agent@sha256:b1ed6e8de56eb4d6e4169ee0d5c209bb5ed1ef071a01c0c042c64b80192a785c -c "
          echo '--- request_timeout definitions ---'
          grep -rn 'request_timeout' /usr/local/lib/python3.14/site-packages/pr_agent/ | head -12
          echo '--- CONFIG__ env prefix ---'
          grep -rn 'CONFIG__' /usr/local/lib/python3.14/site-packages/pr_agent/settings/configuration.py | head -8
          "
