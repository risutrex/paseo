name: Diagnostics (gateway reachability)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Host network
        run: |
          set -u
          host="gate.trinity.guru"
          echo "== host DNS =="
          getent ahosts "$host" | head -4
          echo "== host POST =="
          curl -sS -o /dev/null -m 20 -w 'host POST -> %{http_code} in %{time_total}s\n' \
            -X POST "https://$host/omni/v1/messages" -H 'content-type: application/json' \
            -d '{"model":"x","max_tokens":1,"messages":[{"role":"user","content":"hi"}]}' || echo "host POST failed"

      - name: Inside the reviewer image
        run: |
          cat > /tmp/probe.py <<'PY'
          import json
          import socket
          import time
          import urllib.request

          host = "gate.trinity.guru"
          infos = socket.getaddrinfo(host, 443, proto=socket.IPPROTO_TCP)
          print("getaddrinfo:", [(i[0].name, i[4][0]) for i in infos])
          for info in infos[:4]:
              family = info[0]
              address = info[4]
              started = time.time()
              try:
                  sock = socket.socket(family, socket.SOCK_STREAM)
                  sock.settimeout(8)
                  sock.connect(address)
                  print("connect", address, "ok in %.2fs" % (time.time() - started))
                  sock.close()
              except Exception as error:
                  print("connect", address, "failed:", type(error).__name__, error, "after %.2fs" % (time.time() - started))
          body = json.dumps({"model": "x", "max_tokens": 1, "messages": [{"role": "user", "content": "hi"}]}).encode()
          request = urllib.request.Request("https://" + host + "/omni/v1/messages", data=body, headers={"content-type": "application/json"})
          started = time.time()
          try:
              with urllib.request.urlopen(request, timeout=12) as response:
                  print("urllib POST ->", response.status, "%.2fs" % (time.time() - started))
          except Exception as error:
              print("urllib POST failed:", type(error).__name__, str(error)[:200], "%.2fs" % (time.time() - started))
          PY
          docker run --rm -v /tmp/probe.py:/probe.py:ro --entrypoint python3 \
            pragent/pr-agent@sha256:b1ed6e8de56eb4d6e4169ee0d5c209bb5ed1ef071a01c0c042c64b80192a785c /probe.py
