name: Diagnostics (gateway reachability)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trace the timeout value
        run: |
          cat > /tmp/probe.py <<'PY'
          import pathlib
          import pr_agent

          root = pathlib.Path(pr_agent.__file__).parent
          target = None
          for path in root.rglob("litellm_ai_handler.py"):
              target = path
          lines = target.read_text(errors="ignore").splitlines()
          hits = [(n, l.strip()[:140]) for n, l in enumerate(lines, 1) if "timeout" in l.lower()]
          print("file:", target)
          print(chr(10).join(str(n) + " | " + l for n, l in hits[:40]))
          print("--- context 3290-3335 ---")
          print(chr(10).join(str(n) + " | " + lines[n - 1] for n in range(3290, min(3336, len(lines)))))
          PY
          docker run --rm -v /tmp/probe.py:/probe.py:ro --entrypoint python3 \
            pragent/pr-agent@sha256:b1ed6e8de56eb4d6e4169ee0d5c209bb5ed1ef071a01c0c042c64b80192a785c /probe.py
